name: Copy to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy sala-de-juegos.html to index.html
        run: |
          cp sala-de-juegos.html index.html
          rm sala-de-juegos.html
          git config user.name "thedecro3312-ux"
          git config user.email "thedecro3312-ux@users.noreply.github.com"
          git add index.html sala-de-juegos.html
          git commit -m "Update index.html from sala-de-juegos.html (5 games, no quiz/Niebla, global chat)" || echo "No changes to commit"
          git push
